    <circle cx="80"  cy="240" r="2"/><circle cx="160" cy="240" r="2"/><circle cx="240" cy="240" r="2"/><circle cx="320" cy="240" r="2"/><circle cx="400" cy="240" r="2"/><circle cx="480" cy="240" r="2"/>
    <circle cx="80"  cy="320" r="2"/><circle cx="160" cy="320" r="2"/><circle cx="240" cy="320" r="2"/><circle cx="320" cy="320" r="2"/><circle cx="400" cy="320" r="2"/><circle cx="480" cy="320" r="2"/>
    <circle cx="80"  cy="400" r="2"/><circle cx="160" cy="400" r="2"/><circle cx="240" cy="400" r="2"/><circle cx="320" cy="400" r="2"/><circle cx="400" cy="400" r="2"/><circle cx="480" cy="400" r="2"/>
    <circle cx="80"  cy="480" r="2"/><circle cx="160" cy="480" r="2"/><circle cx="240" cy="480" r="2"/><circle cx="320" cy="480" r="2"/><circle cx="400" cy="480" r="2"/><circle cx="480" cy="480" r="2"/>
    <circle cx="80"  cy="560" r="2"/><circle cx="160" cy="560" r="2"/><circle cx="240" cy="560" r="2"/><circle cx="320" cy="560" r="2"/><circle cx="400" cy="560" r="2"/><circle cx="480" cy="560" r="2"/>
    <circle cx="640" cy="80"  r="2"/><circle cx="720" cy="80"  r="2"/><circle cx="800" cy="80"  r="2"/><circle cx="880" cy="80"  r="2"/><circle cx="960" cy="80"  r="2"/><circle cx="1040" cy="80"  r="2"/><circle cx="1120" cy="80"  r="2"/>
    <circle cx="640" cy="160" r="2"/><circle cx="720" cy="160" r="2"/><circle cx="800" cy="160" r="2"/><circle cx="880" cy="160" r="2"/><circle cx="960" cy="160" r="2"/><circle cx="1040" cy="160" r="2"/><circle cx="1120" cy="160" r="2"/>
    <circle cx="640" cy="240" r="2"/><circle cx="720" cy="240" r="2"/><circle cx="800" cy="240" r="2"/><circle cx="880" cy="240" r="2"/><circle cx="960" cy="240" r="2"/><circle cx="1040" cy="240" r="2"/><circle cx="1120" cy="240" r="2"/>
    <circle cx="640" cy="320" r="2"/><circle cx="720" cy="320" r="2"/><circle cx="800" cy="320" r="2"/><circle cx="880" cy="320" r="2"/><circle cx="960" cy="320" r="2"/><circle cx="1040" cy="320" r="2"/><circle cx="1120" cy="320" r="2"/>
