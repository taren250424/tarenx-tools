  <!-- vertical divider -->
  <line x1="560" y1="80" x2="560" y2="550" stroke="#3effc8" stroke-width="1" opacity="0.12"/>

  <!-- LEFT: logo mark centered in left half -->
  <!-- glow -->
  <ellipse cx="280" cy="315" rx="200" ry="180" fill="#3effc8" opacity="0.03"/>

  <!-- < bracket -->
  <path d="M180 195 L96 315 L180 435" fill="none" stroke="url(#logoGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- > bracket -->
  <path d="M380 195 L464 315 L380 435" fill="none" stroke="url(#logoGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- / slash -->
  <line x1="318" y1="188" x2="242" y2="442" stroke="#3effc8" stroke-width="26" stroke-linecap="round" opacity="0.9"/>
  <!-- cursor bar -->
  <rect x="388" y="289" width="12" height="52" rx="3" fill="#38bfff" opacity="0.7"/>

  <!-- RIGHT: text content -->
  <!-- main title -->
  <text x="620" y="272" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="76" font-weight="700" letter-spacing="-1" fill="url(#textGrad)">SVG</text>
  <text x="620" y="364" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="76" font-weight="700" letter-spacing="-1" fill="#f0f6ff">Playground</text>

  <!-- tagline -->
  <text x="622" y="414" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="22" fill="#64748b" letter-spacing="0.5">Edit, preview, and export SVG — live.</text>


