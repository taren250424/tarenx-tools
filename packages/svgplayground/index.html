<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<meta name="description" content="A beautiful and dynamic SVG playground." />

		<link rel="canonical" href="https://tools.tarenx.com/svgplayground/" />
		<link rel="icon" type="image/svg+xml" href="shared/svgplayground/favicon.svg" />

		<meta property="og:title" content="SVG Playground" />
		<meta property="og:description" content="A beautiful and dynamic SVG playground." />
		<meta property="og:image" content="shared/svgplayground/og.svg" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SVG Playground</title>
	</head>

	<body>
		<header>
			<div class="header-spacer"></div>
			<h1>SVG Playground</h1>
			<div class="header-actions">
				<button id="download-btn" class="primary-btn">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
						<polyline points="7 10 12 15 17 10"></polyline>
						<line x1="12" y1="15" x2="12" y2="3"></line>
					</svg>
					Download SVG
				</button>
			</div>
		</header>
		<main>
			<aside class="ad"></aside>
			<section>
				<div id="editor" class="panel"></div>
				<div id="canvas" class="panel"></div>
			</section>
			<aside class="ad"></aside>
		</main>
		<footer></footer>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
