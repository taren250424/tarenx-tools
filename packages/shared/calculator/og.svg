<svg width="100%" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Calculator Open Graph image</title>
<desc>A wide banner with an orange background, the Calculator logo on the left, and the wordmark "Calculator" with a tagline on the right.</desc>
