    <circle cx="160" cy="220" r="24" fill="#FFFFFF"/>
    <circle cx="256" cy="220" r="24" fill="#FFFFFF"/>
    <circle cx="352" cy="220" r="24" fill="#FFFFFF"/>
    <circle cx="160" cy="292" r="24" fill="#FFFFFF"/>
    <circle cx="256" cy="292" r="24" fill="#FFFFFF"/>
    <circle cx="352" cy="292" r="24" fill="#FFFFFF"/>
    <circle cx="160" cy="364" r="24" fill="#FFFFFF"/>
    <circle cx="256" cy="364" r="24" fill="#FFFFFF"/>
    <circle cx="352" cy="364" r="24" fill="#FFFFFF"/>
